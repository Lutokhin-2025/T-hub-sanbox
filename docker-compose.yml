version: '3.8'

networks:
  t_hub_network:

services:
  db:
    image: postgres:16-alpine
    container_name: t_hub_db
    environment:
      POSTGRES_DB: airports_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./sql_scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airports_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - t_hub_network

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "export DATABASE_URL='postgresql+psycopg2://postgres:postgres@db:5432/airports_db' && python main.py"
    working_dir: /app
    networks:
      - t_hub_network