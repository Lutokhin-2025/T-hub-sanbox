version: '3.8'
services:
  db:
    image: postgres:16
    container_name: t_hub_db
    environment:
      POSTGRES_DB: airports_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "listen_addresses=*", "-c", "host.all=all 0.0.0.0/0 trust"]
    volumes:
      - ./sql_scripts:/docker-entrypoint-initdb.d
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app
    command: python main.py